name: Malaysia disaster display review

on:
  workflow_call:
    inputs:
      source_run_id:
        required: false
        default: ""
        type: string
    secrets:
      OPENAI_API_KEY:
        required: true
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Reuse a Malaysia RSS artifact run ID; empty uses the latest saved Markdown"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare existing input
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -n "${SOURCE_RUN_ID}" ]; then
            [[ "${SOURCE_RUN_ID}" =~ ^[0-9]+$ ]] || exit 1
            gh run download "${SOURCE_RUN_ID}" --pattern 'malaysia-rss-summary-optional-*' --dir "${RUNNER_TEMP}/source"
          fi
          python3 -B - <<'PY'
          import os, pathlib, shutil
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          if os.environ['SOURCE_RUN_ID']:
              candidates = list((root / 'source').rglob('groq_json_render_candidate.md'))
              if len(candidates) != 1:
                  raise SystemExit('Expected exactly one Luna candidate')
          else:
              candidates = sorted(pathlib.Path('news/malaysia').glob('????-??-??.md'))[-1:]
          target = root / 'display-review'
          target.mkdir()
          shutil.copyfile(candidates[0], target / 'input.md')
          PY
      - name: Review display classification only
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          python3 -B scripts/malaysia_news_disaster_display.py \
            --markdown "${RUNNER_TEMP}/display-review/input.md" \
            --output "${RUNNER_TEMP}/display-review/input.display.json" \
            --html-output "${RUNNER_TEMP}/display-review/preview.html"
          cp news/malaysia/daily-page.js news/malaysia/location-map.js "${RUNNER_TEMP}/display-review/"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: malaysia-disaster-display-review-${{ github.run_id }}
          path: ${{ runner.temp }}/display-review/
