name: Meta Ads Personal Feed Groq strict schema probe

on:
  workflow_dispatch:
    inputs:
      field_count:
        description: "Strict response fields to probe (one request only)"
        required: true
        default: "1"
        type: choice
        options: ["1", "2"]

permissions:
  contents: read

concurrency:
  group: meta-ads-groq-schema-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Probe one strict Groq schema request
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          META_ADS_PERSONAL_FEED_GROQ_MODEL: ${{ vars.META_ADS_PERSONAL_FEED_GROQ_MODEL }}
          FIELD_COUNT: ${{ inputs.field_count }}
        run: python3 scripts/meta_ads_groq_schema_probe.py --field-count "${FIELD_COUNT}"
