name: Meta Ads tracker CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-and-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install contract dependencies
        run: python -m pip install -r requirements-meta-ads-tracker.txt
      - name: Run contract, delta, weekly, approval, and fail-closed tests
        run: |
          python3 -m unittest discover scripts -p 'test_meta_ads_tracker*.py'
          python3 -m unittest discover scripts -p 'test_meta_ads_personal_feed.py'
      - name: Validate contracts, publication, workflows, and static JavaScript
        run: |
          python3 scripts/validate_meta_ads_tracker_contract.py
          python3 scripts/validate_meta_ads_tracker_secondary_shadow.py
          python3 scripts/validate_meta_ads_tracker_gate_b.py
          python3 scripts/validate_meta_ads_tracker_weekly_recovery.py
          python3 scripts/validate_meta_ads_tracker_recovery_decisions.py
          python3 scripts/validate_meta_ads_tracker_recovery_promotion.py
          python3 scripts/validate_meta_ads_tracker_publication.py --input meta-ads-updates/latest.json
          python3 scripts/validate_meta_ads_personal_feed.py
          python3 scripts/validate_meta_ads_tracker_workflows.py
          node --check meta-ads-updates/app.js
          node --check scripts/test_meta_ads_tracker_ui.mjs
      - name: Install locked UI dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Verify production UI against approved Workbench design
        env:
          META_ADS_UI_ARTIFACT_DIR: ${{ runner.temp }}/meta-ads-tracker-ui
        run: npm run test:meta-ads-ui
      - name: Upload Meta Ads UI screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: meta-ads-tracker-ui-${{ github.run_id }}
          path: ${{ runner.temp }}/meta-ads-tracker-ui/
