name: Meta Ads tracker collect

on:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: meta-ads-tracker-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tracker validator dependency
        run: python -m pip install -r requirements-meta-ads-tracker.txt
      - name: Collect official changes
        run: |
          today="$(date -u +%F)"
          mkdir -p data/meta_ads_tracker_candidates
          python3 scripts/meta_ads_tracker_collect.py \
            --output "data/meta_ads_tracker_candidates/${today}.json" \
            --state data/meta_ads_tracker_state.json
          if [ "$(date -u +%u)" = "5" ]; then
            mkdir -p data/meta_ads_tracker_weekly
            cp "data/meta_ads_tracker_candidates/${today}.json" "data/meta_ads_tracker_weekly/${today}.json"
          fi
      - name: Validate collected candidate
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from scripts.meta_ads_tracker_publication import validate_candidate
          today = __import__("datetime").date.today().isoformat()
          validate_candidate(json.loads(Path(f"data/meta_ads_tracker_candidates/{today}.json").read_text()))
          print("PASS: candidate contract")
          PY
      - name: Commit candidate and state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/meta_ads_tracker_candidates data/meta_ads_tracker_weekly data/meta_ads_tracker_state.json
          if git diff --cached --quiet; then
            echo "No tracker state change."
          else
            git commit -m "chore: update Meta Ads tracker candidate"
            git push
          fi
      - name: Upload candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: meta-ads-tracker-candidate-${{ github.run_id }}
          path: data/meta_ads_tracker_candidates/
