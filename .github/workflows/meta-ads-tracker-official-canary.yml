name: Read-only Social Media Today fetch diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements-meta-ads-tracker.txt
      - run: python3 scripts/diagnose_smt_article_fetch_readonly.py
