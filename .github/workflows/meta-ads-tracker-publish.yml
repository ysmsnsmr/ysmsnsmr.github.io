name: Meta Ads tracker publish approved report

on:
  workflow_dispatch:
    inputs:
      weekly_cutoff_date:
        description: "Friday cutoff date, YYYY-MM-DD"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: meta-ads-tracker-repository-write
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      WEEKLY_CUTOFF_DATE: ${{ inputs.weekly_cutoff_date }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install tracker validator dependency
        run: python -m pip install -r requirements-meta-ads-tracker.txt
      - name: Publish decisions bound to the immutable weekly artifact
        run: |
          report="${RUNNER_TEMP}/meta_ads_tracker_report.json"
          python3 scripts/publish_meta_ads_tracker.py \
            --weekly-dir data/meta_ads_tracker_weekly \
            --cutoff-date "${WEEKLY_CUTOFF_DATE}" \
            --decisions data/meta_ads_tracker_decisions.json \
            --output "${report}"
          python3 scripts/validate_meta_ads_tracker_publication.py --input "${report}"
          python3 scripts/build_meta_ads_tracker_index.py --input "${report}"
      - name: Commit approved public report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meta-ads-updates/latest.json meta-ads-updates/*.json
          if git diff --cached --quiet; then
            echo "No approved public report change."
          else
            git commit -m "chore: publish approved Meta Ads tracker report"
            git push
          fi
