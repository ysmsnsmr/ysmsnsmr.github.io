name: Meta Ads tracker publish approved report

on:
  workflow_dispatch:
    inputs:
      candidate_date:
        description: "UTC candidate date, YYYY-MM-DD"
        required: true
        type: string
      groq_model:
        description: "Groq model used for review-only drafts"
        required: false
        default: "openai/gpt-oss-120b"
        type: string

permissions:
  contents: write

concurrency:
  group: meta-ads-tracker-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tracker validator dependency
        run: python -m pip install -r requirements-meta-ads-tracker.txt
      - name: Generate review-only Groq draft
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ inputs.groq_model }}
        run: |
          candidate="data/meta_ads_tracker_candidates/${{ inputs.candidate_date }}.json"
          test -f "${candidate}"
          python3 scripts/meta_ads_tracker_groq.py \
            --input "${candidate}" \
            --output "${RUNNER_TEMP}/meta_ads_tracker_groq.json" \
            --model "${GROQ_MODEL}"
      - name: Upload Groq review artifact
        uses: actions/upload-artifact@v4
        with:
          name: meta-ads-tracker-groq-${{ github.run_id }}
          path: ${{ runner.temp }}/meta_ads_tracker_groq.json
      - name: Publish approved decisions
        run: |
          candidate="data/meta_ads_tracker_candidates/${{ inputs.candidate_date }}.json"
          report="${RUNNER_TEMP}/meta_ads_tracker_report.json"
          python3 scripts/publish_meta_ads_tracker.py \
            --candidate "${candidate}" \
            --decisions data/meta_ads_tracker_decisions.json \
            --output "${report}"
          python3 scripts/validate_meta_ads_tracker_publication.py --input "${report}"
          python3 scripts/build_meta_ads_tracker_index.py --input "${report}"
      - name: Commit approved public report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meta-ads-updates/latest.json meta-ads-updates/*.json
          if git diff --cached --quiet; then
            echo "No approved public report change."
          else
            git commit -m "chore: publish approved Meta Ads tracker report"
            git push
          fi
