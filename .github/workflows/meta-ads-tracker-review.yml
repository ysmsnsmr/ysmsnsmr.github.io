name: Meta Ads tracker generate review artifact

on:
  workflow_dispatch:
    inputs:
      weekly_cutoff_date:
        description: "Friday cutoff date, YYYY-MM-DD"
        required: true
        type: string
      groq_model:
        description: "Groq model used for evidence-bound review drafts"
        required: false
        default: "openai/gpt-oss-120b"
        type: string

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    env:
      WEEKLY_CUTOFF_DATE: ${{ inputs.weekly_cutoff_date }}
      GROQ_MODEL: ${{ inputs.groq_model }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install tracker validator dependency
        run: python -m pip install -r requirements-meta-ads-tracker.txt
      - name: Validate input and generate evidence-bound review artifact
        run: |
          weekly="$(python3 scripts/resolve_meta_ads_tracker_weekly.py --directory data/meta_ads_tracker_weekly --cutoff-date "${WEEKLY_CUTOFF_DATE}")"
          python3 scripts/meta_ads_tracker_groq.py \
            --input "${weekly}" \
            --output "${RUNNER_TEMP}/meta_ads_tracker_groq_review.json" \
            --model "${GROQ_MODEL}"
      - name: Upload Groq review artifact
        uses: actions/upload-artifact@v7
        with:
          name: meta-ads-tracker-review-${{ github.run_id }}
          path: ${{ runner.temp }}/meta_ads_tracker_groq_review.json
