name: Meta Ads tracker secondary shadow

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: meta-ads-tracker-secondary-shadow-state
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      SHADOW_STATE_BRANCH: automation/meta-ads-shadow-state
      SHADOW_STATE_FILE: data/meta_ads_tracker_secondary_shadow/state.json
      SHADOW_REPORT_FILE: data/meta_ads_tracker_secondary_shadow/latest.json
    steps:
      - name: Check secondary shadow kill switch
        id: kill_switch
        env:
          META_ADS_TRACKER_SHADOW_ENABLED: ${{ vars.META_ADS_TRACKER_SHADOW_ENABLED }}
        run: |
          setting="${META_ADS_TRACKER_SHADOW_ENABLED:-false}"
          case "${setting}" in
            true)
              echo "enabled=true" >> "${GITHUB_OUTPUT}"
              ;;
            false)
              echo "enabled=false" >> "${GITHUB_OUTPUT}"
              echo "Secondary shadow collection is disabled. Set META_ADS_TRACKER_SHADOW_ENABLED=true after reviewing the sources."
              ;;
            *)
              echo "::error::META_ADS_TRACKER_SHADOW_ENABLED must be true, false, or unset."
              exit 1
              ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.kill_switch.outputs.enabled == 'true'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        if: steps.kill_switch.outputs.enabled == 'true'
        with:
          python-version: "3.12"
      - name: Install tracker validator dependency
        if: steps.kill_switch.outputs.enabled == 'true'
        run: python -m pip install -r requirements-meta-ads-tracker.txt
      - name: Restore isolated shadow state
        if: steps.kill_switch.outputs.enabled == 'true'
        run: |
          state_path="${RUNNER_TEMP}/meta_ads_tracker_secondary_shadow_state.json"
          if git ls-remote --exit-code --heads origin "${SHADOW_STATE_BRANCH}" >/dev/null 2>&1; then
            git fetch origin "refs/heads/${SHADOW_STATE_BRANCH}:refs/remotes/origin/${SHADOW_STATE_BRANCH}"
            git show "origin/${SHADOW_STATE_BRANCH}:${SHADOW_STATE_FILE}" > "${state_path}"
          else
            printf '{"sources":{}}\n' > "${state_path}"
          fi
      - name: Collect secondary signals into the isolated shadow queue
        id: collect
        if: steps.kill_switch.outputs.enabled == 'true'
        run: |
          report="${RUNNER_TEMP}/meta_ads_tracker_secondary_shadow_report.json"
          state="${RUNNER_TEMP}/meta_ads_tracker_secondary_shadow_state.json"
          python3 scripts/meta_ads_tracker_secondary_shadow.py --state "${state}" --output "${report}"
          echo "report=${report}" >> "${GITHUB_OUTPUT}"
          echo "state=${state}" >> "${GITHUB_OUTPUT}"
      - name: Commit isolated shadow state and report
        if: steps.kill_switch.outputs.enabled == 'true'
        env:
          REPORT: ${{ steps.collect.outputs.report }}
          STATE: ${{ steps.collect.outputs.state }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git show-ref --verify --quiet "refs/remotes/origin/${SHADOW_STATE_BRANCH}"; then
            git checkout --force -B "${SHADOW_STATE_BRANCH}" "origin/${SHADOW_STATE_BRANCH}"
          else
            git checkout --orphan "${SHADOW_STATE_BRANCH}"
            git read-tree --empty
          fi
          mkdir -p "$(dirname "${SHADOW_STATE_FILE}")"
          cp "${STATE}" "${SHADOW_STATE_FILE}"
          cp "${REPORT}" "${SHADOW_REPORT_FILE}"
          git add -- "${SHADOW_REPORT_FILE}" "${SHADOW_STATE_FILE}"
          if git diff --cached --quiet; then
            echo "No secondary shadow state change."
          else
            git commit -m "chore: update Meta Ads secondary shadow signals"
            git push origin "HEAD:refs/heads/${SHADOW_STATE_BRANCH}"
          fi
      - name: Upload secondary shadow observation artifact
        if: steps.kill_switch.outputs.enabled == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: meta-ads-tracker-secondary-shadow-${{ github.run_id }}
          path: ${{ steps.collect.outputs.report }}
          if-no-files-found: error
          retention-days: 30
