name: Meta Ads tracker weekly recovery

on:
  workflow_dispatch:
    inputs:
      cutoff_date:
        description: "Friday cutoff date in YYYY-MM-DD; creates a non-public recovery record"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: meta-ads-tracker-repository-write
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    env:
      CUTOFF_DATE: ${{ inputs.cutoff_date }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install tracker validator dependency
        run: python -m pip install -r requirements-meta-ads-tracker.txt
      - name: Validate recovery cutoff and resolve output path
        id: recovery_path
        run: |
          python3 - <<'PY'
          import os
          from datetime import date

          cutoff_date = date.fromisoformat(os.environ["CUTOFF_DATE"])
          if cutoff_date.weekday() != 4:
              raise ValueError("cutoff_date must be a Friday")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"path=data/meta_ads_tracker_weekly_recovery/{cutoff_date.isoformat()}.json\\n")
          PY
      - name: Create non-public weekly recovery record
        run: |
          python3 scripts/meta_ads_tracker_weekly_recovery.py recover \
            --cutoff-date "${CUTOFF_DATE}" \
            --output-dir data/meta_ads_tracker_weekly_recovery
          python3 scripts/validate_meta_ads_tracker_weekly_recovery.py \
            --directory data/meta_ads_tracker_weekly_recovery
      - name: Commit non-public weekly recovery record
        env:
          RECOVERY: ${{ steps.recovery_path.outputs.path }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${RECOVERY}"
          if git diff --cached --quiet; then
            echo "No weekly recovery change."
          else
            git commit -m "chore: record Meta Ads weekly recovery"
            git push
          fi
      - name: Upload non-public weekly recovery record
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: meta-ads-tracker-weekly-recovery-${{ github.run_id }}
          path: ${{ steps.recovery_path.outputs.path }}
          if-no-files-found: error
          retention-days: 30
