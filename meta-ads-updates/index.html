<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0d3b78">
    <meta name="description" content="Meta Adsの公式・非公式情報を区別して表示する更新フィード">
    <title>Meta Ads Personal Feed</title>
    <link rel="stylesheet" href="./style.css">
    <script src="./app.js" defer></script>
  </head>
  <body>
    <main class="tracker-shell">
      <section id="demo-banner" class="demo-banner" aria-label="デモ環境" hidden>
        <strong>デモ環境</strong>
        <span>架空データを表示しています。実運用の承認・判断には使用しないでください。</span>
      </section>
      <section id="recovery-banner" class="recovery-banner" aria-label="遅延回復データ" hidden>
        <strong>遅延回復データ</strong>
        <span id="recovery-banner-copy"></span>
      </section>
      <section id="unofficial-notice" class="unofficial-notice" aria-label="非公式情報の注意" hidden>
        <strong>非公式情報の取り扱い</strong>
        <span>非公式ソースは早期検知の参考情報であり、Meta公式の見解を示すものではありません。公式情報で確認できない内容もあるため、重要な対応や判断には、複数の情報源や実環境で追加確認してください。</span>
      </section>
      <header class="masthead">
        <div>
          <h1>Meta Ads Update Feed</h1>
          <p class="masthead-copy">Meta公式と非公式の情報を区別し、発表日・最終更新日・対象プラットフォームを確認できます。</p>
        </div>
        <p id="week-stamp" class="week-stamp"></p>
      </header>

      <section class="control-panel" aria-labelledby="filter-heading">
        <p id="filter-heading" class="section-kicker">表示条件</p>
        <form id="filter-form" class="filter-form">
          <div class="filter-field">
            <label for="source-filter">ソース</label>
            <select id="source-filter" name="source">
              <option value="all">すべてのソース</option>
              <option value="meta-product-news-rss">Product News</option>
              <option value="meta-business-sdk-releases">Business SDK Releases</option>
            </select>
          </div>
          <div class="filter-field">
            <label id="priority-filter-label" for="priority-filter">ソース区分</label>
            <select id="priority-filter" name="priority">
              <option value="all">すべて</option>
              <option value="official">Meta公式</option>
              <option value="unofficial">非公式・未確認</option>
            </select>
          </div>
          <div class="filter-field">
            <label for="query-filter">キーワード</label>
            <input id="query-filter" name="query" type="search" placeholder="更新名を絞り込む" autocomplete="off">
          </div>
          <button id="reset-button" class="reset-button" type="button">条件をリセット</button>
        </form>
        <p id="result-summary" class="result-summary" aria-live="polite"></p>
      </section>

      <ol id="update-list" class="update-list" aria-live="polite"></ol>

      <section id="empty-state" class="empty-state" aria-live="polite" hidden>
        <h2 id="empty-title"></h2>
        <p id="empty-copy"></p>
      </section>

      <p id="tracker-footer" class="tracker-footer">Meta公式・非公式の情報を区別して表示しています。</p>
    </main>
  </body>
</html>
