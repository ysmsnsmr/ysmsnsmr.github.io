<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0d3b78">
    <meta name="description" content="Meta Ads公式更新の承認済み週次インデックス">
    <title>Meta Ads Official Update Tracker</title>
    <link rel="stylesheet" href="./style.css">
    <script src="./app.js" defer></script>
  </head>
  <body>
    <main class="tracker-shell">
      <section id="demo-banner" class="demo-banner" aria-label="デモ環境" hidden>
        <strong>デモ環境</strong>
        <span>架空データを表示しています。実運用の承認・判断には使用しないでください。</span>
      </section>
      <header class="masthead">
        <div>
          <p class="eyebrow">Official change monitor</p>
          <h1>Meta Ads Official Update Tracker</h1>
          <p class="masthead-copy">公式URLを根拠に、発表日・適用日・rollout・対象・業務影響・対応要否を分けて確認する週次index。</p>
        </div>
        <p id="week-stamp" class="week-stamp"></p>
      </header>

      <section class="control-panel" aria-labelledby="filter-heading">
        <p id="filter-heading" class="section-kicker">表示条件</p>
        <form id="filter-form" class="filter-form">
          <div class="filter-field">
            <label for="source-filter">ソース</label>
            <select id="source-filter" name="source">
              <option value="all">すべてのソース</option>
              <option value="meta-product-news-rss">Product News</option>
              <option value="meta-business-sdk-releases">Business SDK Releases</option>
            </select>
          </div>
          <div class="filter-field">
            <label for="priority-filter">優先度</label>
            <select id="priority-filter" name="priority">
              <option value="all">すべて</option>
              <option value="high">高</option>
              <option value="standard">標準</option>
              <option value="low">低</option>
            </select>
          </div>
          <div class="filter-field">
            <label for="query-filter">キーワード</label>
            <input id="query-filter" name="query" type="search" placeholder="更新名を絞り込む" autocomplete="off">
          </div>
          <button id="reset-button" class="reset-button" type="button">条件をリセット</button>
        </form>
        <p id="result-summary" class="result-summary" aria-live="polite"></p>
      </section>

      <ol id="update-list" class="update-list" aria-live="polite"></ol>

      <section id="empty-state" class="empty-state" aria-live="polite" hidden>
        <h2 id="empty-title"></h2>
        <p id="empty-copy"></p>
      </section>

      <p id="tracker-footer" class="tracker-footer">承認済みの公式更新だけを掲載しています。取得・Groq・validatorが失敗したrunでは、公開済み内容を変更しません。</p>
    </main>
  </body>
</html>
